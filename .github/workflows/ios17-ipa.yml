name: 修复 iOS 发送服务器错误并构建中文版 IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios17-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: 准备发送回归测试
        run: |
          mkdir -p build dist tests
          cat > tests/SendingRegression.swift <<'SWIFT'
          import Foundation

          enum T3Error: Error { case requestFailed(String) }

          @main
          struct SendingRegression {
              static func main() throws {
                  var failures: [String] = []
                  func check(_ condition: Bool, _ message: String) {
                      if !condition { failures.append(message); print("FAIL: \(message)") }
                  }
                  let adapter = OrchestrationV2()
                  let model: [String: Any] = ["instanceId": "codex", "model": "fixture-model"]
                  var command: [String: Any] = ["type": "thread.turn.start", "commandId": "fixture-command", "threadId": "fixture-thread",
                      "message": ["messageId": "fixture-message", "text": "Fixture prompt", "attachments": []],
                      "modelSelection": model, "runtimeMode": "approval-required", "interactionMode": "default"]
                  let sends = try adapter.operations(for: command)
                  let send = sends.last!
                  check(send.method == "orchestration.dispatchCommand", "existing thread RPC method")
                  check(send.payload["createdBy"] as? String == "user", "message.dispatch requires createdBy=user in server 0.1.7")
                  check(send.payload["creationSource"] as? String == "mobile", "message.dispatch requires creationSource=mobile in server 0.1.7")
                  check((send.payload["dispatchMode"] as? [String: String])?["type"] == "start_immediately", "idle thread starts immediately")
                  let encoded = try EffectRPCEncoder.encode(.request(id: "1", tag: send.method, payload: send.payload, headers: []))
                  let request = try JSONSerialization.jsonObject(with: encoded) as! [String: Any]
                  check((request["payload"] as? [String: Any])?["createdBy"] as? String == "user", "actor survives RPC encoding")
                  command["bootstrap"] = ["createThread": ["projectId": "fixture-project", "title": "Fixture", "modelSelection": model,
                      "runtimeMode": "approval-required", "interactionMode": "default"]]
                  let launch = try adapter.operations(for: command)[0]
                  check(launch.method == "orchestration.launchThread", "new thread uses launchThread")
                  check(launch.payload["creationSource"] as? String == "mobile", "new thread records mobile source")
                  check((launch.payload["initialMessage"] as? [String: Any])?["text"] as? String == "Fixture prompt", "new thread preserves first message")

                  // Captured from desktop 0.1.7 when the old iOS request lacked createdBy.
                  let missingKey = "Missing key\n  at [\"createdBy\"]"
                  let cases: [(String, Any, String?, String)] = [
                      ("v2 schema defect", [["_tag": "Die", "defect": missingKey]], nil, missingKey),
                      ("v2 typed failure", [["_tag": "Fail", "error": ["_tag": "OrchestrationV2DispatchCommandError", "message": "Fixture thread not found"]]], "OrchestrationV2DispatchCommandError", "Fixture thread not found"),
                      ("v2 object defect", [["_tag": "Die", "defect": ["name": "Error", "message": "Fixture provider unavailable"]]], nil, "Fixture provider unavailable"),
                      ("v2 string failure", [["_tag": "Fail", "error": "Fixture failure"]], nil, "Fixture failure"),
                      ("v1 typed failure", ["_tag": "Fail", "error": ["_tag": "LegacyError", "message": "Fixture legacy error"]], "LegacyError", "Fixture legacy error"),
                      ("v1 defect", ["_tag": "Die", "defect": "Fixture legacy defect"], nil, "Fixture legacy defect"),
                      ("empty failure", [], nil, "服务器错误")
                  ]
                  for (label, cause, tag, expected) in cases {
                      let frame: [String: Any] = ["_tag": "Exit", "requestId": "1", "exit": ["_tag": "Failure", "cause": cause]]
                      let decoded = try EffectRPCDecoder.decodeFrame(JSONSerialization.data(withJSONObject: frame))
                      guard case let .exit(id, success, _, errorTag, errorMessage) = decoded[0] else {
                          failures.append("\(label): missing Exit"); continue
                      }
                      check(id == "1" && !success && errorTag == tag && errorMessage == expected, "\(label) preserves server reason")
                  }
                  if CommandLine.arguments.count == 3 && CommandLine.arguments[1] == "--emit-fixtures" {
                      let fixtures: [[String: Any]] = [["method": send.method, "payload": send.payload], ["method": launch.method, "payload": launch.payload]]
                      try JSONSerialization.data(withJSONObject: fixtures, options: [.prettyPrinted, .sortedKeys]).write(to: URL(fileURLWithPath: CommandLine.arguments[2]))
                  }
                  guard failures.isEmpty else { print("FAIL: \(failures.count) sending regressions"); exit(1) }
                  print("PASS: existing-thread send and new-thread first-message RPC payloads")
                  print("PASS: protocol 1 and 2 typed errors and defects retain server reasons")
              }
          }
          SWIFT
      - name: 复现旧客户端发送字段缺失与错误信息丢失
        run: |
          swiftc -swift-version 5 -parse-as-library \
            'T3 Code/T3 Code/Core/Networking/EffectRPC.swift' \
            'T3 Code/T3 Code/Core/Networking/OrchestrationV2.swift' \
            tests/SendingRegression.swift -o build/send-before
          set +e
          build/send-before > build/send-before.log 2>&1
          T3_SEND_BASELINE_EXIT=$?
          set -e
          cat build/send-before.log
          if test "$T3_SEND_BASELINE_EXIT" -eq 1; then
            echo '已复现桌面 0.1.7 消息必填字段缺失和错误原因丢失。'
          elif test "$T3_SEND_BASELINE_EXIT" -eq 0 && git apply --reverse --check compatibility/send-fix.patch; then
            echo '发送修复已经应用。'
          else
            echo '发送回归基线未得到预期结果。'
            exit 1
          fi
      - name: 应用发送协议和错误解析修复
        run: |
          if git apply --check compatibility/send-fix.patch; then
            git apply compatibility/send-fix.patch
          elif git apply --reverse --check compatibility/send-fix.patch; then
            echo '发送修复已应用。'
          else
            echo '发送补丁与当前源码不匹配。'
            exit 1
          fi
          cp compatibility/send-fix.patch dist/send-fix.patch
      - name: 验证发送、配对和会话协议
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library \
            'T3 Code/T3 Code/Core/Networking/EffectRPC.swift' \
            'T3 Code/T3 Code/Core/Networking/OrchestrationV2.swift' \
            tests/SendingRegression.swift -o build/send-after
          build/send-after --emit-fixtures dist/send-rpc-fixtures.json | tee build/send-after.log
          swiftc -swift-version 5 -D FIXED_CLIENT -parse-as-library \
            'T3 Code/T3 Code/Core/Networking/Auth/PairingFlow.swift' \
            'T3 Code/T3 Code/Core/Models/EnvironmentDescriptor.swift' \
            'T3 Code/T3 Code/Core/Models/Identifiers.swift' \
            tests/PairingRegression.swift -o build/auth-after
          build/auth-after | tee build/auth-after.log
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          files = sorted(str(path) for path in Path('T3 Code/T3 Code/Core/Models').glob('*.swift'))
          subprocess.run(['swiftc', '-swift-version', '5', '-parse-as-library', *files, 'T3 Code/T3 Code/Core/Networking/OrchestrationV2.swift', 'tests/ProtocolV2Regression.swift', '-o', 'build/protocol-tests'], check=True)
          PYCODE
          build/protocol-tests | tee build/protocol-tests.log
          cat build/send-after.log build/auth-after.log build/protocol-tests.log > dist/regression-results.txt
      - name: 编译 iOS 17.0 arm64 应用
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -quiet \
            -project 'T3 Code/T3 Code.xcodeproj' \
            -scheme 'T3 Code' -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
            build 2>&1 | tee build/build.log
      - name: 验证并打包 TrollStore IPA
        run: |
          mkdir -p build/package/Payload
          ditto 'build/DerivedData/Build/Products/Release-iphoneos/T3 Code.app' 'build/package/Payload/T3 Code.app'
          codesign --force --sign - 'build/package/Payload/T3 Code.app'
          codesign --verify --deep --strict 'build/package/Payload/T3 Code.app'
          python3 - <<'PYCODE'
          from pathlib import Path
          import plistlib, struct
          app = Path('build/package/Payload/T3 Code.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['MinimumOSVersion'] == '17.0'
          assert info['CFBundleIdentifier'] == 'com.belweave.T3-Code'
          assert info['CFBundleVersion'] == '4'
          assert info['CFBundleDevelopmentRegion'] == 'zh-Hans'
          assert info['CFBundleLocalizations'] == ['zh-Hans']
          assert info['CFBundleDisplayName'] == 'T3 Code 中文'
          binary = (app / info['CFBundleExecutable']).read_bytes()
          magic, cpu, subtype, kind, count, size, flags, reserved = struct.unpack_from('<8I', binary)
          assert magic == 0xfeedfacf and cpu == 0x100000c and kind == 2
          offset = 32
          verified = False
          for _ in range(count):
              cmd, length = struct.unpack_from('<2I', binary, offset)
              if cmd == 0x32:
                  platform, minimum = struct.unpack_from('<2I', binary, offset + 8)
                  assert platform == 2 and minimum == 17 << 16, (platform, minimum)
                  verified = True
              offset += length
          assert verified
          report = f"应用：{info['CFBundleDisplayName']}\n版本：{info['CFBundleShortVersionString']}（构建 {info['CFBundleVersion']}）\n最低 iOS：{info['MinimumOSVersion']}\n架构：arm64\n语言：简体中文\n安装方式：TrollStore\nBundle ID：{info['CFBundleIdentifier']}\n"
          Path('dist/build-info.txt').write_text(report)
          print(report)
          PYCODE
          (cd build/package && ditto -c -k --keepParent Payload ../../dist/T3Code-iOS17-zh-Hans-SendFix-v1.0.2-TrollStore.ipa)
          unzip -t dist/T3Code-iOS17-zh-Hans-SendFix-v1.0.2-TrollStore.ipa
          shasum -a 256 dist/T3Code-iOS17-zh-Hans-SendFix-v1.0.2-TrollStore.ipa > dist/SHA256SUMS.txt
      - name: 提交验证通过的发送修复
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'T3 Code' tests
          if ! git diff --cached --quiet; then
            git commit -m '补齐移动端消息创建字段并解析协议 2 错误数组，修复发送服务器错误'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > dist/source-commit.txt
          git archive --format=zip --output=dist/T3Code-Send-Fix-Source.zip HEAD -- 'T3 Code' tests
      - name: 上传发送修复版中文版 IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: T3Code-iOS17-zh-Hans-SendFix
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: 保存编译和回归测试日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: send-fix-build-log
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7
